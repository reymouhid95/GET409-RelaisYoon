<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Séquence — Carte de visite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --nuit: #0d0f14;
        --papier: #f5f2ea;
        --texte: #f5f2ea;
        --lime: #cdff4f;
        --corail: #ff6b4a;
        --gris: #8a8f98;

        --bg: var(--nuit);
        --fg: var(--texte);
        --card-bg: rgba(245, 242, 234, 0.04);
        --line: rgba(245, 242, 234, 0.14);
        --shadow: rgba(0, 0, 0, 0.55);
        --muted: var(--gris);
        --link: var(--lime);
        --em: var(--lime);
        --rec: var(--corail);
      }

      :root[data-theme="light"] {
        --bg: var(--papier);
        --fg: #14161c;
        --card-bg: #ffffff;
        --line: rgba(20, 22, 28, 0.14);
        --shadow: rgba(13, 15, 20, 0.18);
        --muted: #5c616b;
        --link: #14161c;
        --em: #3c4f00;
        --rec: #c13b1a;
      }

      @media (prefers-color-scheme: light) {
        :root:not([data-theme]) {
          --bg: var(--papier);
          --fg: #14161c;
          --card-bg: #ffffff;
          --line: rgba(20, 22, 28, 0.14);
          --shadow: rgba(13, 15, 20, 0.18);
          --muted: #5c616b;
          --link: #14161c;
          --em: #3c4f00;
          --rec: #c13b1a;
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background:
          radial-gradient(900px 480px at 85% -10%, rgba(205, 255, 79, 0.12) 0%, transparent 55%),
          radial-gradient(700px 420px at -10% 110%, rgba(255, 107, 74, 0.14) 0%, transparent 60%),
          var(--bg);
        color: var(--fg);
        font-family: "Inter", system-ui, -apple-system, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 640px;
        background: var(--card-bg);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 40px 36px;
        backdrop-filter: blur(6px);
        box-shadow: 0 40px 80px var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 26px;
        transition: transform 0.25s ease, border-color 0.25s ease;
      }

      .card:hover {
        transform: translateY(-4px);
        border-color: rgba(205, 255, 79, 0.5);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .logo {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: var(--lime);
        color: var(--nuit);
        display: grid;
        place-items: center;
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: -1px;
        flex: none;
      }

      .name {
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .role {
        font-size: 13px;
        color: var(--muted);
        margin-top: 3px;
      }

      .rec {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--rec);
        margin-left: auto;
      }

      .rec::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--rec);
        animation: blink 1.6s steps(2, start) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0.25;
        }
      }

      .pitch {
        font-size: 19px;
        line-height: 1.45;
        border-left: 3px solid var(--lime);
        padding-left: 16px;
      }

      .pitch em {
        font-style: normal;
        color: var(--em);
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        list-style: none;
      }

      .tags li {
        font-size: 13px;
        padding: 8px 15px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        transition: 0.2s;
        cursor: default;
      }

      .tags li:hover {
        color: var(--nuit);
        background: var(--lime);
        border-color: var(--lime);
      }

      .contact {
        border-top: 1px solid var(--line);
        padding-top: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 24px;
        font-size: 14px;
        color: var(--muted);
      }

      .contact a {
        color: var(--link);
        text-decoration: none;
      }

      .contact a:hover {
        text-decoration: underline;
      }

      .theme-toggle {
        position: fixed;
        right: 18px;
        bottom: 18px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--card-bg);
        color: var(--fg);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        backdrop-filter: blur(6px);
        transition: border-color 0.2s ease, transform 0.2s ease;
      }

      .theme-toggle:hover {
        border-color: var(--lime);
        transform: translateY(-2px);
      }

      .theme-toggle:focus-visible {
        outline: 2px solid var(--lime);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        .theme-toggle,
        .card,
        .tags li {
          transition: none;
        }
      }

      @media (max-width: 420px) {
        .card {
          padding: 28px 22px;
          gap: 20px;
        }

        .pitch {
          font-size: 16px;
        }

        .name {
          font-size: 21px;
        }

        .rec {
          display: none;
        }

        .contact {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header class="brand">
        <div class="logo">Sé</div>
        <div>
          <div class="name">Séquence</div>
          <div class="role">Studio de production vidéo par IA — Dakar</div>
        </div>
        <span class="rec">rec</span>
      </header>

      <p class="pitch">
        La vidéo générée, <em>dirigée comme un tournage</em> : cadre, lumière,
        étalonnage — puis le prompt.
      </p>

      <ul class="tags">
        <li>Film publicitaire</li>
        <li>Institutionnel</li>
        <li>Clip &amp; social</li>
        <li>Ateliers</li>
      </ul>

      <footer class="contact">
        <span>Dakar, Sénégal</span>
        <a href="mailto:hello@sequence.studio">hello@sequence.studio</a>
      </footer>
    </main>

    <button class="theme-toggle" type="button" aria-label="Basculer clair/sombre" aria-pressed="false">
      ☀
    </button>

    <script>
      (function () {
        var root = document.documentElement;
        var btn = document.querySelector(".theme-toggle");
        var mq = window.matchMedia("(prefers-color-scheme: light)");

        function system() {
          return mq.matches ? "light" : "dark";
        }

        function stored() {
          try {
            var v = localStorage.getItem("seq-theme");
            return v === "light" || v === "dark" ? v : null;
          } catch (e) {
            return null;
          }
        }

        function apply(theme) {
          root.setAttribute("data-theme", theme);
          var light = theme === "light";
          btn.textContent = light ? "\u263E" : "\u2600";
          btn.setAttribute("aria-pressed", String(light));
          btn.setAttribute(
            "aria-label",
            light ? "Passer en thème sombre" : "Passer en thème clair"
          );
        }

        apply(stored() || system());

        btn.addEventListener("click", function () {
          var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
          apply(next);
          try {
            localStorage.setItem("seq-theme", next);
          } catch (e) {}
        });

        mq.addEventListener("change", function (e) {
          if (stored()) return;
          apply(e.matches ? "light" : "dark");
        });
      })();
    </script>
  </body>
</html>
